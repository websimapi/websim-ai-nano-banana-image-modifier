<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nano Banana Image Modifier</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "nanobanana/app": "./script.js"
            }
        }
    </script>
</head>
<body>
    <header>
        <img id="logo" src="nano_banana_logo.png" alt="Nano Banana Logo">
        <h1>AI Nano Banana Image Modifier</h1>
        <p>Upload an image and tell the AI how to change it!</p>
    </header>

    <main>
        <div id="controls">
            <div class="input-group">
                <label for="image-input">1. Upload Image:</label>
                <input type="file" id="image-input" accept="image/*">
            </div>

            <div class="input-group">
                <label for="prompt-input">2. Describe the modification:</label>
                <textarea id="prompt-input" rows="4" placeholder="e.g., 'Convert this image into a pixel art style, with neon green accents.'"></textarea>
            </div>

            <button id="generate-button" disabled>3. Modify Image</button>
            <div id="loading" class="hidden">Processing... Please wait up to 10 seconds.</div>
        </div>

        <div id="results">
            <h2>Results</h2>
            <div class="image-container">
                <div class="image-box">
                    <h3>Original Image Preview</h3>
                    <img id="original-image-preview" src="" alt="Original Image" class="hidden">
                    <p id="original-placeholder">Upload an image to see a preview.</p>
                </div>
                <div class="image-box">
                    <h3>Modified Image</h3>
                    <img id="modified-image-output" src="" alt="Modified Image" class="hidden">
                    <p id="modified-placeholder">Modified image will appear here.</p>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="nanobanana/app"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
